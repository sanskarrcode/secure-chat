<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Our Secret Space 💖</title>
  
  <!-- PubNub JavaScript SDK -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      --bubble-me: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      --bubble-partner: rgba(255, 255, 255, 0.85);
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px 0 rgba(255, 105, 135, 0.25);
      --text-dark: #4a2e35;
      --text-light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--primary-gradient);
      color: var(--text-dark);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #toast-notification {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(255, 105, 135, 0.3);
      z-index: 2000;
      font-weight: 600;
      font-size: 0.85rem;
      color: #d6336c;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast-notification.show {
      top: 15px;
    }

    #lock-screen {
      position: fixed;
      inset: 0;
      background: var(--primary-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .lock-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .lock-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }

    .lock-card h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
      color: #632034;
    }

    .lock-card p {
      font-size: 0.85rem;
      color: #8c4c5e;
      margin-bottom: 20px;
    }

    .pin-input {
      width: 100%;
      padding: 12px;
      font-size: 1.5rem;
      letter-spacing: 12px;
      text-align: center;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
      outline: none;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      background: var(--bubble-me);
      border: none;
      border-radius: 14px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .error-msg {
      color: #e0245e;
      font-size: 0.8rem;
      margin-top: 10px;
      min-height: 18px;
      font-weight: 600;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--glass-bg);
      position: relative;
    }

    .chat-header {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.5);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #632034;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.6);
      color: #8c4c5e;
      border: 1px solid var(--glass-border);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .status-badge.online {
      color: #0ca678;
      background: rgba(235, 251, 238, 0.85);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .message-bubble {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .message-bubble.me {
      align-self: flex-end;
      background: var(--bubble-me);
      color: var(--text-light);
      border-bottom-right-radius: 4px;
    }

    .message-bubble.partner {
      align-self: flex-start;
      background: var(--bubble-partner);
      color: var(--text-dark);
      border-bottom-left-radius: 4px;
    }

    .message-media {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 4px;
      display: block;
    }

    .timestamp {
      font-size: 0.65rem;
      margin-top: 3px;
      text-align: right;
      opacity: 0.75;
    }

    .input-form {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.6);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .attach-btn {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .send-btn {
      background: var(--bubble-me);
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .shake {
      animation: shakeAnim 0.4s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div id="toast-notification">
    <span id="toast-icon">💖</span>
    <span id="toast-text">Connected</span>
  </div>

  <div id="lock-screen">
    <div class="lock-card" id="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Private Portal</h2>
      <p>Enter our secret code</p>
      <form onsubmit="handlePinSubmit(event)">
        <input 
          type="password" 
          id="pin-input" 
          class="pin-input" 
          maxlength="4" 
          placeholder="••••" 
          inputmode="numeric" 
          pattern="[0-9]*" 
          autocomplete="one-time-code" 
        />
        <button type="submit" class="unlock-btn">Unlock Space 💌</button>
      </form>
      <div class="error-msg" id="pin-error"></div>
    </div>
  </div>

  <div id="app-container">
    <header class="chat-header">
      <div class="header-info">
        <h1>Forever & Always 💖</h1>
        <div id="status-badge" class="status-badge">
          <span class="status-dot">⏳</span> <span id="status-text">Connecting...</span>
        </div>
      </div>
    </header>

    <main class="messages-area" id="messages-area"></main>

    <form class="input-form" onsubmit="handleSendSubmit(event)">
      <label class="attach-btn" title="Send Photo">
        📷
        <input type="file" id="media-input" accept="image/*" style="display: none;" onchange="handleMediaUpload(this)">
      </label>
      <input type="text" id="chat-input" class="chat-input" placeholder="Whisper something sweet..." autocomplete="off" />
      <button type="submit" class="send-btn" title="Send">💌</button>
    </form>
  </div>

  <script>
    const PUBNUB_PUBLISH_KEY = 'pub-c-3c798ac0-70bb-456c-8901-e77aa75de469';
    const PUBNUB_SUBSCRIBE_KEY = 'sub-c-fd1825d6-c035-45fe-a7e4-886b2648bb49';
    const CHAT_CHANNEL = 'private_couple_space_2026';
    const CORRECT_PIN = "1702";

    let myUUID = localStorage.getItem('chat_uuid');
    if (!myUUID) {
      myUUID = 'user-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);
      localStorage.setItem('chat_uuid', myUUID);
    }

    let pubnub = null;

    function handlePinSubmit(e) {
      e.preventDefault();
      const enteredPIN = document.getElementById('pin-input').value.trim();
      const lockCard = document.getElementById('lock-card');
      const pinError = document.getElementById('pin-error');

      if (enteredPIN === CORRECT_PIN) {
        document.getElementById('lock-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('lock-screen').style.display = 'none';
        }, 400);
        initPubNub();
      } else {
        pinError.textContent = "Incorrect PIN ❤️";
        lockCard.classList.add('shake');
        document.getElementById('pin-input').value = '';
        setTimeout(() => lockCard.classList.remove('shake'), 400);
      }
    }

    function initPubNub() {
      try {
        pubnub = new PubNub({
          publishKey: PUBNUB_PUBLISH_KEY,
          subscribeKey: PUBNUB_SUBSCRIBE_KEY,
          userId: myUUID
        });

        pubnub.addListener({
          message: function(event) {
            if (event.message && event.message.senderId !== myUUID) {
              displayMessage(event.message, false);
              showToast("Partner sent a message 💌");
            }
          },
          presence: function(presenceEvent) {
            handlePresence(presenceEvent);
          },
          status: function(statusEvent) {
            if (statusEvent.category === "PNConnectedCategory") {
              fetchChatHistory();
              checkCurrentPresence();
            }
          }
        });

        pubnub.subscribe({
          channels: [CHAT_CHANNEL],
          withPresence: true
        });

      } catch (err) {
        console.error("PubNub Init Error:", err);
      }
    }

    function checkCurrentPresence() {
      if (!pubnub) return;
      pubnub.hereNow({
        channels: [CHAT_CHANNEL],
        includeUUIDs: true
      }).then(response => {
        const occupants = response.channels[CHAT_CHANNEL];
        updatePartnerStatus(occupants && occupants.occupancy > 1);
      }).catch(console.error);
    }

    function handlePresence(event) {
      if (event.uuid === myUUID) return;
      if (event.action === 'join') {
        updatePartnerStatus(true);
        showToast("Partner is Online 💚");
      } else if (event.action === 'leave' || event.action === 'timeout') {
        updatePartnerStatus(false);
      }
    }

    function updatePartnerStatus(isOnline) {
      const badge = document.getElementById('status-badge');
      const text = document.getElementById('status-text');
      if (isOnline) {
        badge.classList.add('online');
        badge.querySelector('.status-dot').textContent = '💚';
        text.textContent = 'Partner Online 💚';
      } else {
        badge.classList.remove('online');
        badge.querySelector('.status-dot').textContent = '⏳';
        text.textContent = 'Waiting...';
      }
    }

    function fetchChatHistory() {
      if (!pubnub) return;
      pubnub.fetchMessages({
        channels: [CHAT_CHANNEL],
        count: 25
      }).then(response => {
        const messages = response.channels[CHAT_CHANNEL] || [];
        messages.forEach(msgItem => {
          displayMessage(msgItem.message, msgItem.message.senderId === myUUID);
        });
      }).catch(console.error);
    }

    function handleSendSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        senderId: myUUID,
        type: 'text',
        content: text,
        timestamp: Date.now()
      };

      displayMessage(payload, true);
      publishPayload(payload);
      input.value = '';
    }

    function handleMediaUpload(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          // Kept small (250px) to stay under PubNub 32KB payload limit
          const maxDim = 250;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
          const payload = {
            senderId: myUUID,
            type: 'image',
            content: compressedBase64,
            timestamp: Date.now()
          };

          displayMessage(payload, true);
          publishPayload(payload);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    }

    function publishPayload(payload) {
      if (!pubnub) return;
      pubnub.publish({
        channel: CHAT_CHANNEL,
        message: payload
      }).catch(err => console.error("Publish Error:", err));
    }

    function displayMessage(payload, isMe) {
      const messagesArea = document.getElementById('messages-area');
      const bubble = document.createElement('div');
      bubble.className = `message-bubble ${isMe ? 'me' : 'partner'}`;

      let mediaHtml = '';
      if (payload.type === 'image') {
        mediaHtml = `<img src="${payload.content}" class="message-media" alt="Shared photo" />`;
      }

      const textHtml = payload.type === 'text' ? escapeHtml(payload.content) : '';
      const formattedTime = new Date(payload.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      bubble.innerHTML = `
        ${mediaHtml}
        ${textHtml ? `<div>${textHtml}</div>` : ''}
        <div class="timestamp">${formattedTime}</div>
      `;

      messagesArea.appendChild(bubble);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      document.getElementById('toast-text').textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
